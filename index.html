<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direct Business · دايركت أعمال</title>
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="theme-color" content="#F47A1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Direct brand palette (from the direct-brand skill): orange #FF6B00, ink #303848,
     muted #6B7480, hairline #E6E8EC, wash #F6F7F9, wash-orange #FFF3EC, gold #FBAE16. */
  --orange:#FF6B00; --orange-2:#F5731E; --orange-3:#FAC79E; --orange-soft:#FFF3EC; --gold:#FBAE16;
  --ink:#303848; --ink-2:#3C4658; --ink-3:#49546A; --ink-4:#5B6478;
  --bg:#FBF5F0; --card:#FFFFFF; --line:#E7E7E7; --line-2:#E1E1E1;
  --txt:#303848; --muted:#6B7480; --muted-2:#98A1AD;
  --green:#16B364; --green-bg:#E7F8EF; --red:#F0453A; --red-bg:#FDECEB;
  --blue:#2E90FA; --blue-bg:#E8F2FE; --amber:#F79009; --amber-bg:#FEF3E2;
  --violet:#7A5AF8; --violet-bg:#EEEBFE; --teal:#15B8A6; --teal-bg:#E4F8F5;
  --tan:#A9781A; --tan-bg:#F6DBBC;
  --shadow:0 1px 2px rgba(28,30,43,.05),0 4px 16px rgba(28,30,43,.06);
  --shadow-lg:0 14px 44px rgba(28,30,43,.14);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo','Inter','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
:lang(ar),[dir=rtl]{font-family:'Cairo','Tajawal','Inter',sans-serif}
a{color:inherit;text-decoration:none}
::selection{background:var(--orange-3)}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{width:256px;background:linear-gradient(180deg,#FDFBF7 0%,#F6F2EB 100%);color:#4E5468;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid #E8E2D6}
.brand{display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 18px 10px;text-align:center}
.brand .logo{width:100%;max-width:175px;height:auto;background:transparent;padding:2px 0}
.brandsub{color:var(--orange);font-size:9.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-family:'Cairo','Inter',sans-serif;margin-top:7px}
.brand .lock{width:100%;margin-top:8px;border-top:1px solid rgba(28,30,43,.08);padding-top:12px;padding-bottom:2px;text-align:center}.lock b{color:#2F3242;font-size:17.5px;letter-spacing:-.01em;font-weight:800}.lock small{color:#2F3242;display:block;margin-top:4px;font-size:12.5px;opacity:.85}
.brand b{font-style:normal;color:#fff;font-size:16.5px;font-weight:800;letter-spacing:.005em;line-height:1.05;display:block}
.brand .bz{color:var(--orange)}html[dir=rtl] .brand,body[dir=rtl] .brand{align-items:center;text-align:center}html[dir=rtl] .brand b,body[dir=rtl] .brand b{text-align:center}html[dir=rtl] .brand small,body[dir=rtl] .brand small{text-align:center}html[dir=rtl] .brand .lock,body[dir=rtl] .brand .lock{text-align:center}
.brand small{display:block;color:#8E94AC;font-size:11px;margin-top:2px;font-family:'Cairo','Tajawal',sans-serif;letter-spacing:0;direction:rtl;text-align:left}
.navsec{padding:6px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#A39B86;font-weight:700;margin-top:10px}
.nav{padding:4px 10px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#555B73;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;font-family:inherit;transition:.15s}
.nav button svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav button:hover{background:rgba(28,30,43,.06);color:#1C1E2B}
.nav button.active{background:#FFF3EC;color:var(--orange);font-weight:700;box-shadow:none}
.nav button.active svg{opacity:1}
.side .foot{padding:14px 16px;border-top:1px solid rgba(28,30,43,.08);font-size:11px;color:#8A8FA3;display:flex;align-items:center;gap:9px}
.side .foot .av{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2E90FA,#7A5AF8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
.side .foot b{color:#1C1E2B;font-size:12px;display:block}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 28px;background:rgba(246,247,251,.8);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8}
.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.03em}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line-2);background:#fff;color:var(--txt);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:var(--shadow)}
.btn:hover{border-color:#cfd3e0;transform:translateY(-1px)}
.btn.pri{background:var(--orange);color:#fff;border:0;box-shadow:0 1px 2px rgba(255,107,0,.18)}
.btn.pri:hover{background:#E36810;filter:none;box-shadow:0 2px 8px rgba(255,107,0,.28)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#fff;color:var(--txt)}
.btn.danger{color:var(--red);border-color:#f3cfcd;background:#fff}
.wrap{padding:26px 28px 48px;max-width:1340px;width:100%;margin:0 auto}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(120deg,#1C1E2B 0%,#2A2D3E 55%,#3C4050 100%);border-radius:20px;padding:26px 28px;color:#fff;position:relative;overflow:hidden;margin-bottom:22px;box-shadow:var(--shadow-lg)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;background:radial-gradient(circle,rgba(255,107,0,.55),transparent 65%);filter:blur(8px)}
.hero h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em;position:relative}
.hero p{margin:7px 0 0;color:#AEB4CC;font-size:13.5px;max-width:560px;position:relative}
.hero .chips{display:flex;gap:10px;margin-top:18px;position:relative;flex-wrap:wrap}
.hero .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:9px 14px;backdrop-filter:blur(4px)}
.hero .chip .v{font-size:18px;font-weight:800}
.hero .chip .l{font-size:10.5px;color:#AEB4CC;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .ic svg{width:19px;height:19px}
.kpi .l{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
.kpi .v{font-size:27px;font-weight:800;margin-top:5px;letter-spacing:-.03em}
.kpi .trend{position:absolute;top:18px;right:18px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.trend.up{background:var(--green-bg);color:var(--green)} .trend.flat{background:#eef0f5;color:var(--muted)}

.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:20px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.card h3{font-size:14px;margin:0 0 4px;font-weight:700;letter-spacing:-.02em}
.card .ch-sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}

/* legends/bars */
.legend{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.legend .it{display:flex;align-items:center;gap:9px;font-size:12.5px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.legend .nm{flex:1;color:#444b60}
.legend .vl{font-weight:700}
.hbar{display:grid;grid-template-columns:130px 1fr 64px;gap:11px;align-items:center;margin-bottom:10px;font-size:12.5px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444b60;font-weight:500}
.hbar .track{background:#f0f2f7;border-radius:6px;height:9px;overflow:hidden}
.hbar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--orange),var(--orange-2))}
.hbar .vl{text-align:right;font-weight:700;font-size:12px}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .st{display:flex;align-items:center;gap:12px}
.funnel .bar{height:38px;border-radius:10px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.funnel .lab{font-size:12px;color:var(--muted);width:120px}

/* ---------- Toolbar / Board ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.search-wrap{position:relative;flex:1;min-width:240px;max-width:380px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search-wrap input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line-2);border-radius:11px;font-size:13px;font-family:inherit;background:#fff;box-shadow:var(--shadow)}
.search-wrap input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,0,.12)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line-2);border-radius:11px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ink);color:#fff}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:16px;align-items:start}
.col{background:#EFF1F6;border:1px solid var(--line);border-radius:16px;padding:12px}
.col .ch{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 4px}
.col .ch .t{font-size:12px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.col .ch .t .pip{width:8px;height:8px;border-radius:50%}
.col .ch .n{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;color:var(--muted)}
.col .desc{font-size:11px;color:var(--muted-2);margin:0 4px 11px}
.lead{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(16,20,40,.04)}
.lead:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--line-2)}
.lead .hd{display:flex;gap:10px;align-items:flex-start}
.lead .ava{width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.lead .nm{font-weight:700;font-size:13.5px;line-height:1.25;letter-spacing:-.01em}
.lead .ar{color:var(--muted);font-size:11.5px;font-family:'Cairo','Tajawal',sans-serif;direction:rtl;text-align:right;margin-top:1px}
.lead .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.01em}
.tag.client{background:var(--green-bg);color:#0f7a44}
.tag.vendor{background:var(--violet-bg);color:#5b46d6}
.tag.partner{background:var(--blue-bg);color:#1a6fc4}
.tag.gov{background:var(--amber-bg);color:#a8650a}
.tag.seg{background:#eef0f5;color:#5b6178}
.tag.b2c{background:var(--teal-bg);color:#0c8a7c}
.lead .ft{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.lead .val{font-weight:800;color:var(--txt);font-size:13px}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line-2)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:#FAFBFD}
tbody tr:last-child td{border-bottom:0}
input.cell,textarea.cell{width:100%;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:7px;font:inherit;color:inherit;resize:vertical}
input.cell:focus,textarea.cell:focus{border-color:var(--orange);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(255,107,0,.1)}
.bench{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px}
.bench.beat{background:var(--green-bg);color:#0f7a44}
.bench.meet{background:var(--blue-bg);color:#1a6fc4}

/* ---------- SOP ---------- */
.sop{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.sop>summary{cursor:pointer;padding:15px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sop>summary::-webkit-details-marker{display:none}
.sop>summary:hover{background:#fafbfd}
.sop .lft{display:flex;align-items:center;gap:11px;min-width:0}
.sop .code{font-size:10.5px;color:#fff;background:var(--ink-3);border-radius:7px;padding:4px 9px;font-weight:700;white-space:nowrap}
.sop .code.whale{background:linear-gradient(135deg,var(--violet),#9b8afb)}
.sop .ti{letter-spacing:-.01em}
.sop .body{padding:4px 18px 20px;color:#3a4054;border-top:1px solid var(--line);margin-top:2px}
.sop .body p{margin:12px 0 0;line-height:1.65}
.sop pre{background:#15171F;color:#E6E9F4;padding:12px 14px;border-radius:10px;overflow:auto;font-size:12px;font-family:ui-monospace,'SF Mono',Consolas,monospace;margin:12px 0 0;line-height:1.6}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:640px){.vs{grid-template-columns:1fr}}
.vs .box{border:1px solid var(--line-2);border-radius:11px;padding:12px 14px}
.vs .box.mkt{background:#fafbfd}
.vs .box.edge{background:linear-gradient(135deg,#FFF6EE,#FFF1E6);border-color:#FBD9B8}
.vs .box .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.vs .box.mkt .h{color:var(--muted)} .vs .box.edge .h{color:#C2691A}
.vs .box p{margin:0 !important;font-size:12.5px;line-height:1.55}

.note{background:linear-gradient(135deg,#FFF6EE,#FFF1E6);border:1px solid #FBD9B8;color:#9A560F;border-radius:13px;padding:13px 16px;font-size:12.8px;margin-bottom:18px;line-height:1.55}
.legend-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:var(--muted)}
.legend-bar b{color:var(--txt)}
.empty{color:var(--muted-2);font-style:italic;padding:22px;text-align:center;font-size:12.5px}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;background:rgba(16,18,28,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;padding:22px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:20px;width:580px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.35);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal .mh h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.modal .mb{padding:18px 22px}
.modal .mf{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:11px;font:inherit;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,0,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.contact{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;margin-bottom:8px;align-items:center}
.contact input{padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;font:inherit;font-size:12.5px}
.x{cursor:pointer;color:var(--red);font-weight:800;padding:5px 9px;border-radius:8px}
.x:hover{background:var(--red-bg)}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--txt);border-color:#cfd3e0}
.menu-btn{display:none}a.v21-skip-link,a.v25-skip,#v25SkipLink{position:absolute!important;left:auto;top:-9999px;z-index:9999}a.v21-skip-link:focus,a.v25-skip:focus,#v25SkipLink:focus{left:10px;top:10px;background:#fff;color:#1C1E2B;padding:8px 14px;border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.scrim{display:none}
@media(max-width:860px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 18px 50px rgba(0,0,0,.45);width:80vw;max-width:300px}
  .side.open{transform:translateX(0)}
  .scrim{position:fixed;inset:0;background:rgba(12,14,22,.55);z-index:40;border:0;padding:0}
  .scrim.show{display:block}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:#fff;color:var(--txt);cursor:pointer;flex:0 0 44px;box-shadow:var(--shadow)}
  .menu-btn svg{width:22px;height:22px}
  .top{padding:10px 14px;gap:10px}
  .top h1{font-size:16px}
  .top .sub{display:none}
  .wrap{padding:16px 14px}
  .tools{gap:6px}
  .tools .btn.sm{padding:10px 11px;min-height:40px}
  .chips{grid-template-columns:1fr 1fr!important}
  .nav button{min-height:46px;font-size:15px}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:12px;white-space:nowrap}
  .modal{width:94vw;max-width:94vw}
  .toolbar{flex-wrap:wrap;gap:8px}
  .seg button{min-height:38px}
}
@media(max-width:480px){
  .chips{grid-template-columns:1fr 1fr!important}
  .top h1{font-size:15px}
  .hero h2{font-size:20px}
  .hero{padding:18px 16px}
  .detail-head{flex-wrap:wrap}
}
/* status + detail + timeline + ops */
.statusbadge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.statusbadge .dot{width:7px;height:7px;border-radius:50%}
.detail-head{display:flex;gap:16px;align-items:flex-start;margin:14px 0 18px}
.detail-head .ava{width:62px;height:62px;border-radius:17px;font-size:23px}
.detail-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}}
.fact{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.fact:last-child{border-bottom:0}.fact .k{color:var(--muted)}.fact .v{font-weight:600;text-align:right}
.timeline{position:relative;padding-left:22px;margin-top:6px}
.timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--line-2)}
.tl-item{position:relative;padding:0 0 16px}.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:"";position:absolute;left:-21px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--orange);border:2px solid #fff;box-shadow:0 0 0 2px var(--line-2)}
.tl-item .when{font-size:11px;color:var(--muted-2)}
.tl-item .what{font-size:13px;margin-top:2px;line-height:1.5}
.contact-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.contact-row:last-child{border-bottom:0}
.contact-row .ci{width:32px;height:32px;border-radius:9px;background:#eef0f5;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:12px;flex:0 0 32px}
.contact-row a{color:var(--blue)}
.chiplink{font-size:12.5px;color:var(--blue);font-weight:700}
.reqcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer;box-shadow:0 1px 2px rgba(16,20,40,.04);transition:.15s}
.reqcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.reqcard .rc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.reqcard .svc{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef0f5;color:#5b6178}
.reqcard .due{font-size:10.5px;font-weight:700}
.reqcard .due.over{color:var(--red)}.reqcard .due.ok{color:var(--muted)}
.field input[list]{font-family:inherit}
/* global search */
.gsearch-wrap{position:relative;flex:1;max-width:480px;margin:0 18px}
.gsearch-wrap>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.gsearch-wrap input{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--line-2);border-radius:11px;font:inherit;font-size:13px;background:#fff;box-shadow:var(--shadow)}
.gsearch-wrap input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,0,.12)}
.gres{position:absolute;top:46px;inset-inline-start:0;min-width:100%;width:max-content;max-width:min(520px,72vw);background:#fff;border:1px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-lg);max-height:400px;overflow:auto;display:none;z-index:40;padding:6px}
.gres-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px}
.gres-item:hover{background:#F6F3EE}
.gres-item .gres-t{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--ink-3);border-radius:6px;padding:3px 7px;flex:0 0 auto}
.gres-item .gres-l{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.gres-item .gres-s{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;max-width:45%}
@media(max-width:780px){.gsearch-wrap{display:none}}
.reqcard,.lead{cursor:grab}.reqcard:active,.lead:active{cursor:grabbing}
.col.drop{outline:2px dashed var(--orange);outline-offset:-4px;background:#FFF3E8}
.exp-wrap{position:relative;display:inline-block}
.exp-menu{position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-lg);display:none;z-index:40;min-width:196px;padding:6px}
.exp-menu.show{display:block}
.exp-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 11px;font:inherit;font-size:12.5px;border-radius:7px;cursor:pointer;color:var(--txt)}
.exp-menu button:hover{background:#f6f3ee}
.supchk{cursor:pointer}
.dropzone{display:flex;align-items:center;gap:12px;border:2px dashed var(--line-2);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#faf9f6;transition:.15s;cursor:pointer}
.dropzone.over{border-color:var(--orange);background:#FFF3E8}
.dropzone .dz-ic{font-size:22px;flex:0 0 auto}
.kl{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kv{font-size:18px;font-weight:800;letter-spacing:-.02em}
.related a{display:inline-flex;align-items:center;gap:5px;background:#f4f1ec;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--txt);text-decoration:none;margin:3px 4px 0 0;cursor:pointer;border:1px solid var(--line)}
.related a:hover{border-color:var(--orange);color:var(--orange)}
@media(max-width:860px){.dropzone{flex-wrap:wrap}.dropzone input{margin-left:0!important;width:100%}}
.offer-wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:18px;align-items:start;margin-top:12px}
@media(max-width:1000px){.offer-wrap{grid-template-columns:1fr}}
.offer-preview{position:sticky;top:84px}
.odoc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.odoc-head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--orange);padding-bottom:12px;margin-bottom:14px}
.odoc-row{font-size:13px;margin:7px 0;color:#33384a}
.odoc-tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px}
.odoc-tbl th,.odoc-tbl td{border:1px solid var(--line-2);padding:8px 9px;text-align:left}
.odoc-tbl th{background:#faf7f2;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.odoc-tbl .k{font-weight:700;background:#faf7f2;width:130px}
.odoc-note{background:var(--orange-soft);border:1px solid #FBD9B8;color:#9A560F;padding:10px;border-radius:8px;font-size:12px;margin-top:10px}
.odoc-foot{margin-top:14px;border-top:1px solid var(--line);padding-top:9px;font-size:11px;color:var(--muted)}
.brand .lock b{color:#2F3242!important;font-size:18px!important;letter-spacing:-.01em}.brand .lock b .bz{color:var(--orange)!important}.brand .lock small{color:#2F3242!important;font-size:12.5px!important;opacity:.9;text-align:center;width:100%}.brand .lock{text-align:center!important}html,body{margin:0!important;padding:0!important}.side{overflow:hidden}.side .nav{overflow-y:auto;flex:1 1 auto;min-height:0;scrollbar-width:thin;scrollbar-color:#D9D3C7 transparent}.side .nav::-webkit-scrollbar{width:5px}.side .nav::-webkit-scrollbar-thumb{background:#D9D3C7;border-radius:99px}.side .nav::-webkit-scrollbar-track{background:transparent}/* ===== v31 premium theme overlay (CSS only, additive, reversible) ===== */

.card{border-radius:18px;border:1px solid #E6E8EC;box-shadow:0 1px 2px rgba(20,22,43,.04),0 7px 24px -12px rgba(20,22,43,.11)}
.btn{border-radius:12px;box-shadow:0 1px 2px rgba(20,22,43,.05);font-weight:700}
.btn.pri{background:linear-gradient(135deg,#FF6B00,#F5731E)!important;border-color:transparent!important;color:#fff!important;box-shadow:var(--orange-glow)!important}
.btn.pri:hover{filter:brightness(1.04)}
.search-wrap,.gsearch-wrap{border-radius:999px!important;box-shadow:0 1px 2px rgba(20,22,43,.05)}
.tbl-wrap table{border-collapse:separate;border-spacing:0}
.tbl-wrap table thead th{text-transform:uppercase;letter-spacing:.07em;font-size:11px;font-weight:800;color:#9AA0B2;background:#FCFAF7;padding:14px 16px;border-bottom:1px solid #EFE9DF}
.tbl-wrap table tbody td{padding:14px 16px;border-bottom:1px solid #F2ECE3}
.tbl-wrap table tbody tr{transition:background .12s}

.tbl-wrap table tbody tr:last-child td{border-bottom:0}
.statusbadge,.tag,.tag.seg,.tag.client,.tag.b2c,.tag.partner{border-radius:999px;font-weight:700}
.chip{border-radius:15px;box-shadow:0 1px 2px rgba(20,22,43,.05);border:1px solid #EFE9DF}
.chip .v,.kv{letter-spacing:-.025em;font-weight:800}
.chiplink{font-weight:700}
.ava,.ci{box-shadow:0 2px 6px rgba(20,22,43,.12)}
.detail-head .ava{border-radius:16px;box-shadow:0 6px 18px -8px rgba(20,22,43,.25)}
.modal{border-radius:20px!important;box-shadow:var(--shadow-lg)!important}
.field input,.field select,.field textarea,.toolbar select,select{border-radius:11px}
.note{border-radius:14px}
.seg{border-radius:999px}
.seg button,.viewseg button,#viewseg button{border-radius:999px}

<style id="v46-mobile">
/* v46 — mobile hardening. On a phone the top bar packed the page title plus every tool button
   into one non-wrapping row, so the buttons spilled off the right edge and dragged the whole
   page sideways — it rendered zoomed-out and shifted ("the page is off"). Fix: on small screens
   let the tools drop onto their own full-width row instead of overflowing, and hide the buttons
   that only make sense on a computer (export, ⌘K shortcut, help, "view as…", share links).
   Desktop is untouched, and every hidden tool is still fully available on a computer. */
@media(max-width:640px){
  /* Several older layers each restyle this top bar (one forces the tools to width:100%, another
     adds margin-left:auto, a third tries a column layout) and together they left it spilling off
     the right edge — which zoomed the whole page out. These !important rules settle it: a simple
     wrapping row, tools sized to their content, and the desktop-only + admin buttons hidden on
     phones (all still available on a computer). Result: nothing exceeds the screen width. */
  .top{ display:flex !important; flex-direction:row !important; flex-wrap:wrap !important;
        align-items:center !important; gap:8px !important; }
  .top .tools{ width:auto !important; max-width:100% !important; margin-left:auto !important;
               flex-wrap:wrap !important; justify-content:flex-end !important; gap:6px !important; }
  .top .exp-wrap,
  .top #kBtn,
  .top #hBtn,
  .top #v25PresetBtn,
  .top #cl_share,
  .top #cl_team,
  .top #v41acc{ display:none !important; }
  #vTitle{ font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wrap{ max-width:100%; }
  /* wide tables keep scrolling inside their own box instead of stretching the page */
  #board,.tbl-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; }
}
</style>

<style id="v47-declutter">
/* v47 — declutter. The team already knows what each page is, so strip the explanatory chrome
   that only added visual noise on phone and desktop alike:
   - the descriptive subtitle under each page title ("People or companies that might book with us")
   - the little orange "?" help circles next to titles

   - the small grey helper lines under card headings
   Titles, data, filters, tags and the working buttons all stay. This is presentation-only and

#cl_dash{ display:none !important; }                        /* old Clients KPI strip that rendered as broken full-width bars (duplicate of the clean summary card) */
</style>
