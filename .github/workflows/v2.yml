# v2 — the Commercial app rebuild (docs/v2/). Runs only when v2 changes; the old app at the repository root has no CI
# and is never touched from here (V12: v2 merges into v2/main, never into the default branch).
name: v2

on:
  pull_request:
    # v2/main, and a step's branch when the next step is stacked on it before it merges (BUILD-PLAN "Handing over").
    branches: ['v2/**']
    paths: ['v2/**', 'docs/v2/**', '.github/workflows/v2.yml']
  push:
    branches: [v2/main]
    paths: ['v2/**', 'docs/v2/**', '.github/workflows/v2.yml']
  workflow_dispatch:

concurrency:
  # a pull request's newer push cancels its older run; a run on v2/main is never cancelled, so the production database
  # job is never stopped half-way (V181) — each merge's run has its own group, and that job queues on its own
  group: v2-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # The base the forward-only migrations check compares with (A9).
  V2_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before) || 'origin/v2/main' }}

defaults:
  run:
    working-directory: v2

jobs:
  checks:
    name: checks, lint, types, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: checks (TECH-SPEC §9.1)
        run: pnpm checks
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  sabotage:
    name: every check and unit test fails under its sabotage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sabotage.mjs --kind check --kind lint --kind unit

  db-plain:
    name: database from zero (Postgres 17) and its sabotage
    runs-on: ubuntu-latest
    # every SQL test is run again under each of its sabotages (over 170 now): 15 minutes no longer covers it
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
      - name: the SQL suite on a database built from zero
        run: node scripts/db/test.mjs
      - name: every SQL test fails under its sabotage
        run: node scripts/sabotage.mjs --kind sql

  db-supabase:
    name: database from zero on the Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: start the stack (a new database; every migration applied)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api,mailpit
      - name: the production job's check agrees with a stack built from zero (V181)
        run: node scripts/db/prod-sync.mjs --local
      - name: Supabase's advisors find nothing at warning level (before the test harness is installed)
        run: supabase db advisors --local --type all --level warn --fail-on warn
      - name: the SQL suite on the Supabase stack
        run: node scripts/db/test.mjs --target supabase
      - if: always()
        run: supabase stop --no-backup

  e2e:
    name: build and end-to-end
    runs-on: ubuntu-latest
    # the suite alone: its sabotages run in e2e-sabotage below since 12 Oct (they had grown to 105 minutes here, and
    # this limit from 30 to 150 with them)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: start the stack (database, auth, the Data API and the mail catcher; every migration applied)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: the stack's addresses and keys for the app and the specs (its fixed local ones, never the cloud's — V120)
        run: node scripts/e2e/stack-env.mjs >> "$GITHUB_ENV"
      - name: the api schema's types match the migrations (V114)
        run: node scripts/db/gen-types.mjs --check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: v2/playwright-report
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup

  e2e-sabotage:
    name: every end-to-end spec fails under its sabotage (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # one build per sabotage: on a single runner the sweep alone took 105 minutes at #211 (12 Oct) and kept growing
    # with every PR, so it runs as three shards side by side; each shard is about a third of that plus its setup
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: start the stack (database, auth, the Data API and the mail catcher; every migration applied)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: the stack's addresses and keys for the app and the specs (its fixed local ones, never the cloud's — V120)
        run: node scripts/e2e/stack-env.mjs >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: this shard's end-to-end sabotages each turn their spec red
        run: node scripts/sabotage.mjs --kind e2e --shard ${{ matrix.shard }}/3
      - if: always()
        run: supabase stop --no-backup

  # The one writer of the production database (the owner, 30 Sep — V181). On every merge to v2/main it applies the
  # migrations production has not had, with the Supabase CLI, then fails loudly unless production and main hold the
  # same migrations. It never runs on a pull request, so no branch reaches production; no session writes there.
  # It reaches the database with the database password alone, through the region's pooler: no access token.
  every-control:
    name: every control on main (report)
    # QA 1's crawl (tests/qa/sweep/18-every-control.spec.ts): as the admin, a Commercial member and someone signed out,
    # at 1440 and 375 px, in English and Arabic, every page reached through the menus and links and every button, tab,
    # filter, toggle and menu on it pressed once (never sign out, Undo, delete, archive, switch off, merge or close
    # month). A report, never a gate: it runs after a merge, it is in no job's needs, and its findings never fail it.
    # Findings come out as warning annotations (readable through the check-run annotations API; GitHub keeps 10 per
    # step and 50 per job, so one step carries V633's size warnings and four more the 40 most severe) and all of them
    # as a table in the step summary, with V633's counts of menu entries and visible actions per role and width.
    # a push to v2/main or a run by hand there (this workflow's only other trigger is pull_request)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v2/main'
    runs-on: ubuntu-latest
    # QA 1's local run of 13 Oct on 4d63b0f: 59 minutes for the crawl (2,758 cells, three people side by side) plus about
    # 5 for the stack, the build and the seed; 150 leaves room for a slower runner
    timeout-minutes: 150
    env:
      QA_RUN_DIR: /tmp/qa-sweep
      QA_MATRIX: /tmp/qa-sweep/matrix.jsonl
      QA_SHOTS: /tmp/qa-sweep/shots
      QA_ROUND: "1"
      SUPABASE_BIN: supabase
      SIGN_IN_METHOD: password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: the QA stack (its own local ports and project; every migration applied)
        run: |
          node tests/qa/sweep/stack.mjs prepare
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api,mailpit --workdir "$QA_RUN_DIR/stack"
          node tests/qa/sweep/stack.mjs env >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: the app on 9610, and the made-up people and organisations
        run: |
          (pnpm exec next start -p 9610 > "$QA_RUN_DIR/app.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:9610/sign-in && break; sleep 1; done
          node tests/qa/sweep/seed.mjs
      - name: every control (a report; its findings never fail this job)
        continue-on-error: true
        run: pnpm exec playwright test -c tests/qa/sweep/playwright.config.ts --grep "every control" --workers=3
      - name: the findings, most severe first (the step summary holds them all)
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const dir = process.env.QA_RUN_DIR;
            const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l)) : []);
            const rank = { High: 0, Medium: 1, Low: 2 };
            const seen = new Map();
            for (const r of read(dir + "/results.jsonl")) {
              const m = /^\[(High|Medium|Low)\] (.*)$/.exec(r.check || "");
              if (!m) continue;
              const key = m[1] + "|" + (r.screen || "") + "|" + m[2];
              if (!seen.has(key)) seen.set(key, { sev: m[1], page: r.screen || "", problem: m[2], who: [] });
              seen.get(key).who.push(r.user || "");
            }
            // the V633 counts first: they get a step of their own, so the size warnings always show
            const v633 = (f) => /V633/.test(f.problem) ? 0 : 1;
            const all = [...seen.values()].sort((a, b) => v633(a) - v633(b) || rank[a.sev] - rank[b.sev] || a.page.localeCompare(b.page));
            const clean = (s) => String(s).replace(/[\r\n%]/g, " ").replace(/::/g, ": ");
            const line = (f) => `::warning title=${clean(f.sev + " · " + f.page)}::${clean(f.who.join(", ") + " · " + f.page + " · " + f.problem)}`;
            fs.writeFileSync(dir + "/v633.txt", all.filter((f) => !v633(f)).map(line).join("\n") + "\n");
            fs.writeFileSync(dir + "/annotations.txt", all.filter(v633).map((f) =>
              `::warning title=${clean(f.sev + " · " + f.page)}::${clean(f.who.join(", ") + " · " + f.page + " · " + f.problem)}`).join("\n") + "\n");
            const cells = read(process.env.QA_MATRIX);
            // V633: menu entries per role and width, and visible actions per page (phone limit 12, menu limit 9)
            const counts = cells.filter((c) => c.kind === "count");
            const cols = [...new Set(counts.map((c) => c.role + " · " + c.width))].sort();
            const rows = [...new Set(counts.map((c) => c.route + " | " + c.control))].sort((a, b) => (a.startsWith("the menu") ? -1 : b.startsWith("the menu") ? 1 : a.localeCompare(b)));
            const cellOf = (row, col) => {
              const hit = counts.filter((c) => c.route + " | " + c.control === row && c.role + " · " + c.width === col && c.lang === "en");
              return hit.length ? hit.map((c) => (c.ok ? c.result : "**" + c.result + "**")).join(" / ") : "";
            };
            const countTable = ["", "### V633 counts (English; over the limit in bold)", "",
              "| Page · count | " + cols.join(" | ") + " |", "|---|" + cols.map(() => "---|").join(""),
              ...rows.map((r) => "| `" + r.split(" | ")[0] + "` · " + r.split(" | ")[1] + " | " + cols.map((c) => cellOf(r, c)).join(" | ") + " |")];
            const bad = cells.filter((c) => !c.ok).length;
            const sum = [`## Every control on ${process.env.GITHUB_SHA.slice(0, 7)}`, "",
              `${cells.length} cells (pages, links and controls), ${cells.length - bad} fine, ${bad} need a fix; ${all.length} distinct findings.`, "",
              "| Severity | Page | Problem | Who · language · width |", "|---|---|---|---|",
              ...all.map((f) => `| ${f.sev} | \`${f.page}\` | ${clean(f.problem).replace(/\|/g, "/")} | ${f.who.join(", ")} |`), ...countTable];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, sum.join("\n") + "\n");
          '
      - name: V633 size warnings (a phone page over 12 actions, a menu over 9 entries)
        if: always()
        run: sed -n '1,10p' "$QA_RUN_DIR/v633.txt" || true
      - name: annotations 1–10
        if: always()
        run: sed -n '1,10p' "$QA_RUN_DIR/annotations.txt" || true
      - name: annotations 11–20
        if: always()
        run: sed -n '11,20p' "$QA_RUN_DIR/annotations.txt" || true
      - name: annotations 21–30
        if: always()
        run: sed -n '21,30p' "$QA_RUN_DIR/annotations.txt" || true
      - name: annotations 31–40
        if: always()
        run: sed -n '31,40p' "$QA_RUN_DIR/annotations.txt" || true
      - if: always()
        run: supabase stop --no-backup --workdir "$QA_RUN_DIR/stack"

  db-production:
    name: production database applies main's migrations
    if: github.ref == 'refs/heads/v2/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # production is written only after main's own checks and both databases built from zero are green (QA-185); these
    # three lines are guarded by scripts/checks/production-job.mjs (QA-502)
    needs: [checks, db-plain, db-supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the GitHub environment "production" holds the database password and lets only v2/main deploy (QA-186)
    environment: production
    # one at a time and never cancelled half-way; a later merge waits, then applies whatever is still pending
    concurrency:
      group: v2-production-database
      cancel-in-progress: false
    env:
      # direct-commercial (GO-LIVE-RUNBOOK §2): a project ref and its region are addresses, not secrets
      SUPABASE_PROJECT_REF: kimadjvaxgiqzjaukuqg
      SUPABASE_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v4
      - name: the database password is set (GitHub → Settings → Environments → production)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error title=Production database not updated::secret not set in the production environment: SUPABASE_DB_PASSWORD"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # the password reaches this step alone; the address it finds is masked and handed on as SUPABASE_PROD_DB_URL
      - name: reach production through its region's pooler (a read)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/db/prod-url.mjs
      # --include-all: a migration production has not had is applied even when it sorts before production's newest
      # (20261003162500, behind the placeholder 20261006161037); the next step still fails unless the two agree
      - name: apply the migrations production has not had (migrations only — no seed, no vault, no config)
        run: supabase db push --db-url "$SUPABASE_PROD_DB_URL" --include-all --skip-vault --yes
      - name: production and main hold the same migrations
        run: node scripts/db/prod-sync.mjs --db-url
