# v2 — the Commercial app rebuild (docs/v2/). Runs only when v2 changes; the old app at the repository root has no CI
# and is never touched from here (V12: v2 merges into v2/main, never into the default branch).
name: v2

on:
  pull_request:
    # v2/main, and a step's branch when the next step is stacked on it before it merges (BUILD-PLAN "Handing over").
    branches: ['v2/**']
    paths: ['v2/**', 'docs/v2/**', '.github/workflows/v2.yml']
  push:
    branches: [v2/main]
    paths: ['v2/**', 'docs/v2/**', '.github/workflows/v2.yml']
  workflow_dispatch:

concurrency:
  # a pull request's newer push cancels its older run; a run on v2/main is never cancelled, so the production database
  # job is never stopped half-way (V181) — each merge's run has its own group, and that job queues on its own
  group: v2-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # The base the forward-only migrations check compares with (A9).
  V2_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before) || 'origin/v2/main' }}

defaults:
  run:
    working-directory: v2

jobs:
  checks:
    name: checks, lint, types, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: checks (TECH-SPEC §9.1)
        run: pnpm checks
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  sabotage:
    name: every check and unit test fails under its sabotage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sabotage.mjs --kind check --kind lint --kind unit

  db-plain:
    name: database from zero (Postgres 17) and its sabotage
    runs-on: ubuntu-latest
    # every SQL test is run again under each of its sabotages (over 170 now): 15 minutes no longer covers it
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
      - name: the SQL suite on a database built from zero
        run: node scripts/db/test.mjs
      - name: every SQL test fails under its sabotage
        run: node scripts/sabotage.mjs --kind sql

  db-supabase:
    name: database from zero on the Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: start the stack (a new database; every migration applied)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api,mailpit
      - name: the production job's check agrees with a stack built from zero (V181)
        run: node scripts/db/prod-sync.mjs --local
      - name: Supabase's advisors find nothing at warning level (before the test harness is installed)
        run: supabase db advisors --local --type all --level warn --fail-on warn
      - name: the SQL suite on the Supabase stack
        run: node scripts/db/test.mjs --target supabase
      - if: always()
        run: supabase stop --no-backup

  e2e:
    name: build and end-to-end
    runs-on: ubuntu-latest
    # one build per end-to-end sabotage (over 50 now): 30 minutes no longer covers the suite and them
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: start the stack (database, auth, the Data API and the mail catcher; every migration applied)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: the stack's addresses and keys for the app and the specs (its fixed local ones, never the cloud's — V120)
        run: node scripts/e2e/stack-env.mjs >> "$GITHUB_ENV"
      - name: the api schema's types match the migrations (V114)
        run: node scripts/db/gen-types.mjs --check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - name: every end-to-end spec fails under its sabotage
        run: node scripts/sabotage.mjs --kind e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: v2/playwright-report
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup

  # The one writer of the production database (the owner, 30 Sep — V181). On every merge to v2/main it applies the
  # migrations production has not had, with the Supabase CLI, then fails loudly unless production and main hold the
  # same migrations. It never runs on a pull request, so no branch reaches production; no session writes there.
  # It reaches the database with the database password alone, through the region's pooler: no access token.
  db-production:
    name: production database applies main's migrations
    if: github.ref == 'refs/heads/v2/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # one at a time and never cancelled half-way; a later merge waits, then applies whatever is still pending
    concurrency:
      group: v2-production-database
      cancel-in-progress: false
    env:
      # direct-commercial (GO-LIVE-RUNBOOK §2): a project ref and its region are addresses, not secrets
      SUPABASE_PROJECT_REF: kimadjvaxgiqzjaukuqg
      SUPABASE_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v4
      - name: the database password is set (GitHub → Settings → Secrets and variables → Actions)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error title=Production database not updated::repository secret not set: SUPABASE_DB_PASSWORD"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # the password reaches this step alone; the address it finds is masked and handed on as SUPABASE_PROD_DB_URL
      - name: reach production through its region's pooler (a read)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/db/prod-url.mjs
      - name: apply the migrations production has not had (migrations only — no seed, no vault, no config)
        run: supabase db push --db-url "$SUPABASE_PROD_DB_URL" --skip-vault --yes
      - name: production and main hold the same migrations
        run: node scripts/db/prod-sync.mjs --db-url
