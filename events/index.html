<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSA Events Hub | Direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#e6e8ec; --text:#303848; --muted:#6b7480;
    --accent:#f06820; --logo-orange:#ff6c00; --gold:#fbae16; --wash-orange:#fff3ec;
    --travel:#1f6f8b; --tech:#8b3a62; --study:#4a7c1f; --other:#8a6d3b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Proxima Nova','Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  header{background:linear-gradient(to right,#e54525 0%,#f26721 100%);color:#fff;padding:20px 24px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{flex:none;transform:rotate(-18deg)}
  .brand .wordmark{font-size:22px;font-weight:800;letter-spacing:-.01em;color:#fff}
  .brand .sub{margin:2px 0 0;font-size:12px;color:#ffe9d6;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:5px;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 6px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
  .header-actions{display:flex;gap:8px;flex-wrap:wrap}
  main{max-width:1600px;margin:0 auto;padding:18px 24px 60px}
  .stats{display:flex;gap:24px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:14px}
  .stat b{font-size:19px;font-weight:800}
  .stat span{font-size:11.5px;color:var(--muted);margin-left:4px}
  .toolbar{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .toolbar .field{display:flex;flex-direction:column;gap:3px}
  .toolbar label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
  .toolbar select, .toolbar input{padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:13px;font-family:inherit;color:var(--text)}
  .toolbar .count{margin-left:auto;font-size:12.5px;color:var(--muted);align-self:center}
  .btn{border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#d85a1a}
  .btn-secondary{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4)}
  .btn-secondary:hover{background:rgba(255,255,255,.25)}
  .btn-chip{background:#fff;border:1px solid var(--border);color:var(--text)}
  .btn-chip.active{background:var(--wash-orange);border-color:var(--accent);color:var(--accent)}
  .btn-sm{padding:4px 9px;font-size:11.5px;border-radius:5px}
  .btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
  .btn-outline:hover{background:#f2f2f5}
  .btn-danger-outline{background:#fff;border:1px solid #e3b3b3;color:#a3242c}
  .btn-danger-outline:hover{background:#fff2f2}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px;overflow:hidden;border:1px solid var(--border);font-size:12.5px}
  thead th{background:#f87020;text-align:left;padding:9px 10px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#fff;cursor:pointer;user-select:none;white-space:nowrap}
  thead th:hover{background:#e2611a}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  tbody tr:hover{background:var(--wash-orange)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.dim{opacity:.55}
  tbody tr.hi-priority{border-left:3px solid var(--gold)}
  .pill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
  .pill.travel{background:#e0eef4;color:var(--travel)}
  .pill.tech{background:#f3e0ec;color:var(--tech)}
  .pill.study{background:#e8f2dd;color:var(--study)}
  .pill.other{background:#f2ead2;color:var(--other)}
  .pill.st-confirmed{background:#dff5e1;color:#1e7a34}
  .pill.st-needs_verification{background:#fff3d6;color:#8b5b1f}
  .pill.st-stale{background:#fddede;color:#a3242c}
  .pill.st-outside_window{background:#e9e9e9;color:#666}
  .pill.st-outside_ksa{background:#e0e6f7;color:#3a4f9e}
  .pill.st-no_date{background:#eee;color:#888}
  .pill.opp-sales{background:#dceeff;color:#1a5c9e}
  .pill.opp-partner{background:#ffe6d5;color:#a35216}
  .pill.mv-stand{background:#ffe6d5;color:#c2560a}
  .pill.mv-attend{background:#dff5e1;color:#1e7a34}
  .pill.mv-mine{background:#dceeff;color:#1a5c9e}
  .pill.mv-skip{background:#e9e9e9;color:#666}
  .pill.mv-undecided{background:#fff;color:#8b5b1f;border:1px dashed #d9b98a}
  .move-progress{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
  .move-progress.p-done{color:#1e7a34;font-weight:600}
  .prio-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--border);margin-right:2px}
  .prio-dots span.on{background:var(--gold)}
  .name{font-weight:600}
  .name-ar{color:var(--muted);font-size:11px;margin-top:2px;direction:rtl;text-align:left}
  .notes{font-size:11.5px;color:var(--muted);max-width:220px}
  a{color:var(--accent);text-decoration:none;font-size:11.5px}
  a:hover{text-decoration:underline}
  .month{white-space:nowrap;font-weight:500}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .row-actions{display:flex;gap:6px;white-space:nowrap}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.2);position:relative}
  .modal h2{margin:0 0 4px;font-size:18px}
  .modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1/-1}
  .form-field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em}
  .form-field input, .form-field select, .form-field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}
  .form-field textarea{resize:vertical;min-height:56px}
  .checkbox-row{display:flex;gap:16px;align-items:center;padding-top:6px}
  .checkbox-row label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:normal;text-transform:none;color:var(--text)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .toast{position:fixed;bottom:20px;right:20px;background:#303848;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s}
  .toast.show{opacity:1}
  @media (max-width:900px){
    .form-grid{grid-template-columns:1fr}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:#fff}
    td{border:none;padding:6px 12px}
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12L3 5l3 7-3 7 18-7z" fill="#ff6c00"/></svg>
      <span class="wordmark">Direct</span>
    </div>
    <p class="brand sub"><span class="live-dot"></span>Live &middot; KSA Events Hub &middot; Travel &middot; Tech &middot; Study</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" id="btnHistory">History</button>
  </div>
</header>
<main>
  <div class="stats" id="statsBar"></div>
  <div class="toolbar">
    <div class="field"><label>Search</label><input id="fSearch" type="search" placeholder="Name, city, venue, organiser..." style="min-width:200px"></div>
    <div class="field"><label>Vertical</label><select id="fVertical"><option value="">All verticals</option></select></div>
    <div class="field"><label>Status</label><select id="fStatus"><option value="">All statuses</option></select></div>
    <div class="field"><label>Our move</label><select id="fMove"><option value="">All</option><option value="stand">Have a stand</option><option value="attend">Go &amp; meet</option><option value="mine">Mine the website</option><option value="skip">Skip</option><option value="undecided">Not decided</option></select></div>
    <div class="field"><label>Opportunity</label><select id="fOpp"><option value="">All</option><option value="sales">Sales prospect</option><option value="partner">Competitor/Partner</option></select></div>
    <div class="field"><label>City</label><select id="fCity"><option value="">All cities</option></select></div>
    <div class="field"><label>Venue</label><select id="fVenue"><option value="">All venues</option></select></div>
    <div class="field"><label>Priority</label><select id="fPriority"><option value="">All</option><option value="high">High (4-5)</option><option value="medium">Medium (3)</option><option value="low">Low (1-2)</option></select></div>
    <button class="btn btn-chip btn-sm" id="btnUpcoming" style="align-self:center">Next 30 days</button>
    <button class="btn btn-outline btn-sm" id="btnExportCsv" style="align-self:center">CSV</button>
    <button class="btn btn-outline btn-sm" id="btnExportJson" style="align-self:center">JSON</button>
    <button class="btn btn-primary" id="btnAdd" style="align-self:center">+ Add event</button>
    <div class="count" id="countBox"></div>
  </div>
  <table id="eventTable">
    <thead>
      <tr>
        <th data-sort="priority">Priority</th>
        <th data-sort="date">Dates</th>
        <th data-sort="name">Event</th>
        <th data-sort="move">Our move</th>
        <th data-sort="vertical">Vertical</th>
        <th data-sort="status">Status</th>
        <th data-sort="city">City</th>
        <th data-sort="venue">Venue</th>
        <th>Opportunity</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <h2 id="modalTitle">Add Event</h2>
    <div class="sub">Saved live to the shared database &mdash; visible to everyone immediately.</div>
    <div class="form-grid">
      <div class="form-field full"><label>Event name (English) *</label><input id="fld_n" type="text"></div>
      <div class="form-field full"><label>Event name (Arabic)</label><input id="fld_nAr" type="text" dir="rtl"></div>
      <div class="form-field"><label>Start date</label><input id="fld_start" type="date"></div>
      <div class="form-field"><label>End date</label><input id="fld_end" type="date"></div>
      <div class="form-field"><label>City</label><input id="fld_city" type="text" placeholder="Riyadh"></div>
      <div class="form-field"><label>Venue</label><input id="fld_venue" type="text"></div>
      <div class="form-field"><label>Vertical *</label>
        <select id="fld_vertical"><option value="Travel">Travel</option><option value="Tech">Tech</option><option value="Study">Study</option><option value="Other">Other</option></select>
      </div>
      <div class="form-field"><label>Status</label>
        <select id="fld_status">
          <option value="confirmed">Confirmed</option><option value="needs_verification">Needs verification</option>
          <option value="stale">Stale</option><option value="outside_window">Outside Aug&ndash;Dec window</option>
          <option value="outside_ksa">Outside KSA</option><option value="no_date">No date on record</option>
        </select>
      </div>
      <div class="form-field"><label>Priority (1-5)</label>
        <select id="fld_priority"><option value="1">1 &mdash; Low</option><option value="2">2</option><option value="3" selected>3 &mdash; Medium</option><option value="4">4</option><option value="5">5 &mdash; High</option></select>
      </div>
      <div class="form-field"><label>Organiser</label><input id="fld_organiser" type="text"></div>
      <div class="form-field full"><label>Official link</label><input id="fld_link" type="text" placeholder="https://"></div>
      <div class="form-field full">
        <label>Opportunity type</label>
        <div class="checkbox-row">
          <label><input type="checkbox" id="fld_opp_sales"> Sales prospect</label>
          <label><input type="checkbox" id="fld_opp_partner"> Competitor/partner intel</label>
        </div>
      </div>
      <div class="form-field full"><label>Our move — what we do with this event</label>
        <select id="fld_move">
          <option value="undecided">Not decided yet</option>
          <option value="stand">Have a stand — book a booth and sell from it</option>
          <option value="attend">Go &amp; meet — walk the floor, collect leads in person</option>
          <option value="mine">Mine the website — sign up online, pull the companies list &amp; contacts (no travel)</option>
          <option value="skip">Skip — not for us</option>
        </select>
      </div>
      <div class="form-field"><label>Progress</label>
        <select id="fld_move_status">
          <option value="not_started">Not started</option>
          <option value="signed_up">Signed up / registered</option>
          <option value="in_progress">Working on it</option>
          <option value="leads_added">Leads collected</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="form-field"><label>Companies list (link)</label><input id="fld_list_url" type="text" placeholder="https:// — exhibitor or registry page"></div>
      <div class="form-field full"><label>Notes</label><textarea id="fld_notes"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save Event</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="historyOverlay">
  <div class="modal" style="max-width:720px">
    <button class="modal-close" id="historyClose">&times;</button>
    <h2>Change history</h2>
    <div class="sub">Last 50 changes across all events, newest first.</div>
    <div id="historyList" style="max-height:60vh;overflow-y:auto;font-size:12.5px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://vkxoeeoauexyfpzqufqd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZreG9lZW9hdWV4eWZwenF1ZnFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MTcwNzAsImV4cCI6MjA5NzE5MzA3MH0.Ni57dK00kAywxcqF_m5KA_X4gWAO6BPa6xiulY8y2sk';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUS_LABEL = {confirmed:"Confirmed", needs_verification:"Needs verification", stale:"Stale", outside_window:"Outside window", outside_ksa:"Outside KSA", no_date:"No date"};
const OPP_LABEL = {sales:"Sales", partner:"Partner"};
const MOVE_LABEL = {stand:"Have a stand", attend:"Go & meet", mine:"Mine the website", skip:"Skip", undecided:"Not decided"};
const PROGRESS_LABEL = {not_started:"Not started", signed_up:"Signed up", in_progress:"Working on it", leads_added:"Leads collected", done:"Done"};
function moveOf(e){ return e.approach || 'undecided'; }
function progressOf(e){ return e.approach_status || 'not_started'; }
const MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let EVENTS = [];
let editingId = null;
const state = {sortKey:'date', sortDir:1};
const tbody = document.querySelector('#eventTable tbody');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function fmtDate(iso){ if(!iso) return "TBC"; const d=new Date(iso+'T00:00:00'); return d.getDate()+" "+MONTH[d.getMonth()]; }
function dateRange(s,e){ if(!s) return "TBC"; return s===e?fmtDate(s):fmtDate(s)+" – "+fmtDate(e); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const parts = dateStr.split('-').map(Number);
  const dd = new Date(parts[0], parts[1]-1, parts[2]); dd.setHours(0,0,0,0);
  return Math.round((dd.getTime()-now.getTime())/86400000);
}
function isUpcoming(e){
  const s = daysUntil(e.start_date), en = daysUntil(e.end_date);
  if (s!==null && s>=0 && s<=30) return true;
  if (s!==null && en!==null && s<=0 && en>=0) return true;
  return false;
}

async function loadEvents(){
  const {data, error} = await sb.from('ksa_events').select('*').order('start_date', {ascending:true, nullsFirst:false});
  if (error){ toast('Load failed: '+error.message); return; }
  EVENTS = data;
  render();
}

function populateFilters(){
  const vSel=document.getElementById('fVertical'), cSel=document.getElementById('fCity'), venSel=document.getElementById('fVenue');
  [[vSel,'vertical'],[cSel,'city'],[venSel,'venue']].forEach(function(pair){
    const sel=pair[0], key=pair[1];
    const keep = sel.value;
    const first = sel.options[0].outerHTML;
    sel.innerHTML = first;
    Array.from(new Set(EVENTS.map(function(e){return e[key];}))).filter(Boolean).sort().forEach(function(v){
      const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
    });
    sel.value = keep;
  });
  const stSel = document.getElementById('fStatus');
  if (stSel.options.length<=1){
    Object.keys(STATUS_LABEL).forEach(function(k){ const o=document.createElement('option'); o.value=k; o.textContent=STATUS_LABEL[k]; stSel.appendChild(o); });
  }
}

let upcomingOnly = false;
function filtered(){
  const v=document.getElementById('fVertical').value, st=document.getElementById('fStatus').value;
  const op=document.getElementById('fOpp').value, c=document.getElementById('fCity').value;
  const ven=document.getElementById('fVenue').value, pr=document.getElementById('fPriority').value;
  const mv=document.getElementById('fMove').value;
  const q=document.getElementById('fSearch').value.toLowerCase().trim();
  return EVENTS.filter(function(e){
    if (v && e.vertical!==v) return false;
    if (st && e.status!==st) return false;
    if (mv && moveOf(e)!==mv) return false;
    if (op==='sales' && !e.opportunity_sales) return false;
    if (op==='partner' && !e.opportunity_partner) return false;
    if (c && e.city!==c) return false;
    if (ven && e.venue!==ven) return false;
    if (pr==='high' && e.priority<4) return false;
    if (pr==='medium' && e.priority!==3) return false;
    if (pr==='low' && e.priority>2) return false;
    if (upcomingOnly && !isUpcoming(e)) return false;
    if (q){
      const hay=[e.name_en,e.name_ar,e.city,e.venue,e.organiser,e.notes].filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(q)===-1) return false;
    }
    return true;
  });
}

function sorted(list){
  const k=state.sortKey, d=state.sortDir;
  const keyfn = {
    date: function(e){return e.start_date||"9999";}, name: function(e){return e.name_en.toLowerCase();}, vertical: function(e){return e.vertical;},
    status: function(e){return e.status;}, city: function(e){return e.city||'';}, venue: function(e){return e.venue||'';}, priority: function(e){return e.priority;},
    move: function(e){return ({stand:1,attend:2,mine:3,undecided:4,skip:5})[moveOf(e)]||9;}
  }[k];
  return list.slice().sort(function(a,b){const av=keyfn(a),bv=keyfn(b); return av<bv?-d:av>bv?d:0;});
}

function renderStats(){
  const total=EVENTS.length, confirmed=EVENTS.filter(function(e){return e.status==='confirmed';}).length;
  const upcoming=EVENTS.filter(isUpcoming).length;
  const nStand=EVENTS.filter(function(e){return moveOf(e)==='stand';}).length;
  const nAttend=EVENTS.filter(function(e){return moveOf(e)==='attend';}).length;
  const nMine=EVENTS.filter(function(e){return moveOf(e)==='mine';}).length;
  const nUndecided=EVENTS.filter(function(e){return moveOf(e)==='undecided';}).length;
  const rows = [
    ['Total',total,''], ['Confirmed',confirmed,'color:#1e7a34'], ['Next 30 days',upcoming,'color:#c2560a'],
    ['Have a stand',nStand,'color:#c2560a'], ['Go & meet',nAttend,'color:#1e7a34'], ['Mine the website',nMine,'color:#1a5c9e'], ['Not decided',nUndecided,'color:#8b5b1f']
  ];
  document.getElementById('statsBar').innerHTML = rows.map(function(r){
    return '<div class="stat"><b style="'+r[2]+'">'+r[1]+'</b><span>'+r[0]+'</span></div>';
  }).join('');
}

function render(){
  populateFilters();
  renderStats();
  const list = sorted(filtered());
  tbody.innerHTML = '';
  if (list.length===0){
    tbody.innerHTML = '<tr><td colspan="10" class="empty">No events match those filters.</td></tr>';
  } else {
    list.forEach(function(e){
      const tr = document.createElement('tr');
      if (['outside_window','stale','no_date'].indexOf(e.status)!==-1) tr.classList.add('dim');
      if (e.priority>=4) tr.classList.add('hi-priority');
      const dots = [1,2,3,4,5].map(function(i){return '<span class="'+(i<=e.priority?'on':'')+'"></span>';}).join('');
      const oppPills = [e.opportunity_sales?'<span class="pill opp-sales">'+OPP_LABEL.sales+'</span>':'', e.opportunity_partner?'<span class="pill opp-partner">'+OPP_LABEL.partner+'</span>':''].filter(Boolean).join(' ');
      const link = e.link ? '<a href="'+e.link+'" target="_blank" rel="noopener">Link ↗</a>' : '';
      const mv = moveOf(e), pg = progressOf(e);
      const showProgress = (mv!=='skip' && mv!=='undecided');
      const listLink = e.exhibitor_list_url ? '<div><a href="'+e.exhibitor_list_url+'" target="_blank" rel="noopener">Companies list ↗</a></div>' : '';
      const moveCell = '<span class="pill mv-'+mv+'">'+MOVE_LABEL[mv]+'</span>'+
        (showProgress?'<div class="move-progress'+(pg==='done'||pg==='leads_added'?' p-done':'')+'">'+PROGRESS_LABEL[pg]+'</div>':'')+listLink;
      tr.innerHTML =
        '<td class="prio-dots">'+dots+'</td>'+
        '<td class="month">'+dateRange(e.start_date,e.end_date)+'</td>'+
        '<td><div class="name">'+e.name_en+'</div><div class="name-ar">'+(e.name_ar||'')+'</div>'+(link?'<div>'+link+'</div>':'')+(e.notes?'<div class="notes">'+e.notes+'</div>':'')+'</td>'+
        '<td>'+moveCell+'</td>'+
        '<td><span class="pill '+e.vertical.toLowerCase()+'">'+e.vertical+'</span></td>'+
        '<td><span class="pill st-'+e.status+'">'+STATUS_LABEL[e.status]+'</span></td>'+
        '<td>'+(e.city||'—')+'</td>'+
        '<td>'+(e.venue||'—')+'</td>'+
        '<td>'+(oppPills||'—')+'</td>'+
        '<td class="row-actions"><button class="btn btn-outline btn-sm" data-edit="'+e.id+'">Edit</button><button class="btn btn-danger-outline btn-sm" data-del="'+e.id+'">Delete</button></td>';
      tbody.appendChild(tr);
    });
  }
  document.getElementById('countBox').textContent = list.length+' of '+EVENTS.length+' events';
  tbody.querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click', function(){openModal(b.dataset.edit);});});
  tbody.querySelectorAll('[data-del]').forEach(function(b){b.addEventListener('click', function(){deleteEvent(b.dataset.del);});});
}

async function deleteEvent(id){
  const evt = EVENTS.find(function(e){return e.id===id;});
  if (!evt) return;
  if (!confirm('Delete "'+evt.name_en+'"? This is saved live and can be restored from History.')) return;
  const {error} = await sb.from('ksa_events').delete().eq('id', id);
  if (error){ toast('Delete failed: '+error.message); return; }
  toast('Deleted — visible to everyone now.');
}

function openModal(id){
  editingId = id || null;
  const evt = id ? EVENTS.find(function(e){return e.id===id;}) : null;
  document.getElementById('modalTitle').textContent = evt ? 'Edit Event' : 'Add Event';
  document.getElementById('fld_n').value = evt ? evt.name_en : '';
  document.getElementById('fld_nAr').value = evt ? (evt.name_ar||'') : '';
  document.getElementById('fld_start').value = evt ? (evt.start_date||'') : '';
  document.getElementById('fld_end').value = evt ? (evt.end_date||'') : '';
  document.getElementById('fld_city').value = evt ? (evt.city||'') : '';
  document.getElementById('fld_venue').value = evt ? (evt.venue||'') : '';
  document.getElementById('fld_vertical').value = evt ? evt.vertical : 'Travel';
  document.getElementById('fld_status').value = evt ? evt.status : 'confirmed';
  document.getElementById('fld_priority').value = evt ? evt.priority : 3;
  document.getElementById('fld_organiser').value = evt ? (evt.organiser||'') : '';
  document.getElementById('fld_link').value = evt ? (evt.link||'') : '';
  document.getElementById('fld_opp_sales').checked = evt ? evt.opportunity_sales : false;
  document.getElementById('fld_opp_partner').checked = evt ? evt.opportunity_partner : false;
  document.getElementById('fld_move').value = evt ? moveOf(evt) : 'undecided';
  document.getElementById('fld_move_status').value = evt ? progressOf(evt) : 'not_started';
  document.getElementById('fld_list_url').value = evt ? (evt.exhibitor_list_url||'') : '';
  document.getElementById('fld_notes').value = evt ? (evt.notes||'') : '';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); editingId=null; }

async function saveModal(){
  const name_en = document.getElementById('fld_n').value.trim();
  if (!name_en){ alert('Event name is required.'); return; }
  const start_date = document.getElementById('fld_start').value || null;
  const end_date = document.getElementById('fld_end').value || null;
  if (start_date && end_date && end_date < start_date){ alert('End date cannot be before start date.'); return; }
  const link = document.getElementById('fld_link').value.trim();
  if (link && !/^https?:\/\//i.test(link)){ alert('Link must start with http:// or https://'); return; }
  const listUrl = document.getElementById('fld_list_url').value.trim();
  if (listUrl && !/^https?:\/\//i.test(listUrl)){ alert('Companies list link must start with http:// or https://'); return; }
  const data = {
    name_en: name_en, name_ar: document.getElementById('fld_nAr').value.trim() || null,
    start_date: start_date, end_date: end_date,
    city: document.getElementById('fld_city').value.trim() || null,
    venue: document.getElementById('fld_venue').value.trim() || null,
    vertical: document.getElementById('fld_vertical').value,
    status: document.getElementById('fld_status').value,
    priority: parseInt(document.getElementById('fld_priority').value, 10),
    organiser: document.getElementById('fld_organiser').value.trim() || null,
    link: link || null,
    opportunity_sales: document.getElementById('fld_opp_sales').checked,
    opportunity_partner: document.getElementById('fld_opp_partner').checked,
    approach: document.getElementById('fld_move').value,
    approach_status: document.getElementById('fld_move_status').value,
    exhibitor_list_url: listUrl || null,
    notes: document.getElementById('fld_notes').value.trim() || null
  };
  let error;
  if (editingId){
    ({error} = await sb.from('ksa_events').update(data).eq('id', editingId));
  } else {
    ({error} = await sb.from('ksa_events').insert(data));
  }
  if (error){ toast('Save failed: '+error.message); return; }
  closeModal();
  toast(editingId ? 'Saved — visible to everyone now.' : 'Added — visible to everyone now.');
}

function csvEscape(v){ if(v==null) v=''; return '"'+String(v).replace(/"/g,'""')+'"'; }
function exportCsv(){
  const header = ["Name (EN)","Name (AR)","Our move","Progress","Companies list","Vertical","Status","Priority","Start","End","City","Venue","Organiser","Link","Sales","Partner","Notes"];
  const lines = ['﻿'+header.map(csvEscape).join(',')];
  EVENTS.forEach(function(e){
    lines.push([e.name_en,e.name_ar,MOVE_LABEL[moveOf(e)],PROGRESS_LABEL[progressOf(e)],e.exhibitor_list_url,e.vertical,e.status,e.priority,e.start_date,e.end_date,e.city,e.venue,e.organiser,e.link,e.opportunity_sales,e.opportunity_partner,e.notes].map(csvEscape).join(','));
  });
  downloadFile(lines.join('\r\n'), 'ksa_events.csv', 'text/csv');
}
function exportJson(){ downloadFile(JSON.stringify(EVENTS,null,2), 'ksa_events.json', 'application/json'); }
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function openHistory(){
  document.getElementById('historyOverlay').classList.add('open');
  const {data, error} = await sb.from('ksa_events_audit').select('*').order('changed_at', {ascending:false}).limit(50);
  const list = document.getElementById('historyList');
  if (error){ list.innerHTML = 'Could not load history: '+error.message; return; }
  list.innerHTML = data.map(function(row){
    const name = (row.new_data && row.new_data.name_en) || (row.old_data && row.old_data.name_en) || 'Unknown';
    const when = new Date(row.changed_at).toLocaleString();
    return '<div style="padding:8px 0;border-bottom:1px solid var(--border)"><b>'+row.operation+'</b> — '+name+' <span style="color:var(--muted)">· '+when+'</span></div>';
  }).join('') || '<div class="empty">No history yet.</div>';
}

function init(){
  loadEvents();
  document.getElementById('btnAdd').addEventListener('click', function(){openModal(null);});
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', saveModal);
  document.getElementById('btnHistory').addEventListener('click', openHistory);
  document.getElementById('historyClose').addEventListener('click', function(){document.getElementById('historyOverlay').classList.remove('open');});
  document.getElementById('btnExportCsv').addEventListener('click', exportCsv);
  document.getElementById('btnExportJson').addEventListener('click', exportJson);
  document.getElementById('btnUpcoming').addEventListener('click', function(ev){
    upcomingOnly = !upcomingOnly;
    ev.target.classList.toggle('active', upcomingOnly);
    render();
  });
  ['fSearch','fVertical','fStatus','fMove','fOpp','fCity','fVenue','fPriority'].forEach(function(id){
    document.getElementById(id).addEventListener('input', render);
    document.getElementById(id).addEventListener('change', render);
  });
  document.querySelectorAll('th[data-sort]').forEach(function(th){
    th.addEventListener('click', function(){
      const k = th.dataset.sort;
      if (state.sortKey===k) state.sortDir*=-1; else { state.sortKey=k; state.sortDir=1; }
      render();
    });
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('historyOverlay').addEventListener('click', function(e){ if(e.target.id==='historyOverlay') document.getElementById('historyOverlay').classList.remove('open'); });

  sb.channel('ksa_events_changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'ksa_events'}, function(){ loadEvents(); })
    .subscribe();
}
init();
</script>
